[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyVDERM"
version = "2.0.0"
description = "Volumetric Density-Equalizing Reference Map — 3D shape deformation and 2D cartogram generation"
readme = "README_pypi.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Jonah Spector", email = "spector.jo@northeastern.edu"}
]
keywords = ["cartogram", "deformation", "3d", "2d", "visualization", "density-equalizing", "vderm", "geojson", "shapefile"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "matplotlib>=3.3",
    "pandas>=1.3",
    "tqdm>=4.60",
]

[project.optional-dependencies]
# Full 2D pipeline: GeoJSON, Shapefile, GeoTIFF I/O
"2D" = [
    "geopandas>=0.12",
    "rasterio>=1.3",
    "shapely>=2.0",
]
# Full 3D pipeline: mesh I/O and Poisson reconstruction
"3D" = ["pymeshlab>=2023.12"]
# Everything
all = [
    "geopandas>=0.12",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pymeshlab>=2023.12",
]

[project.urls]
Homepage = "https://github.com/jspector792/pyVDERM"
Repository = "https://github.com/jspector792/pyVDERM"
Issues = "https://github.com/jspector792/pyVDERM/issues"
